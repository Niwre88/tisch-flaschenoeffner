<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flaschenöffner Automatik</title>
<style>
  :root { --bg:#eef1f5; --panel:#ffffffe8; --text:#1d2633; --dim:#5d6b7d; --acc:#1f6fd1; --line:#cfd7e2; --ok:#1d8a4a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#10151d; --panel:#18202bea; --text:#dbe5f1; --dim:#8c9bb0; --acc:#5aa2ff; --line:#2b3a4e; --ok:#4cc27e; } }
  :root[data-theme="dark"] { --bg:#10151d; --panel:#18202bea; --text:#dbe5f1; --dim:#8c9bb0; --acc:#5aa2ff; --line:#2b3a4e; --ok:#4cc27e; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.45 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
  #ui { position:fixed; left:12px; top:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; width:310px; max-height:calc(100vh - 48px); overflow:auto; }
  h1 { margin:0 0 2px; font-size:15px; }
  .dim { color:var(--dim); font-size:12px; }
  button, select { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:4px 8px; margin:2px 2px 2px 0; cursor:pointer; font:inherit; }
  select { width:100%; margin-top:2px; }
  button:hover, select:hover { border-color:var(--acc); }
  label { display:block; margin-top:8px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  #schritt { margin-top:8px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); min-height:38px; }
  #schritt b { color:var(--acc); }
  table { border-collapse:collapse; margin-top:6px; width:100%; font-size:12px; }
  td { padding:1px 0; } td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .an { color:var(--ok); font-weight:600; }
  @media (max-width:600px) { #ui { width:calc(100vw - 48px); max-height:45vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Flaschenöffner Automatik TFO-A</h1>
  <div class="dim">Ziehen = drehen · Mausrad/Pinch = zoomen</div>
  <div>
    <button data-v="30,-24,1">Schräg</button><button data-v="0,-10,1">Bediener</button>
    <button data-v="0,-89,1.3">Oben</button><button data-v="35,-18,2.6">Kopf nah</button>
  </div>
  <label>Flaschensorte im Magazin
    <select id="fl"></select></label>
  <div style="margin-top:6px">
    <button id="play">⏸ Pause</button>
    <button id="pm">Mensch aus</button><button id="ph">Haube aus</button>
  </div>
  <label>Geschwindigkeit <input id="tempo" type="range" min="0.25" max="3" step="0.25" value="1"></label>
  <div id="schritt"></div>
  <table id="tab"></table>
</div>
<script>
const DATEN = /*DATEN*/[];
const FLASCHEN = /*FLASCHEN*/[];
const INFO = /*INFO*/{};
const FARBE = {
  profil:[195,203,214], normteil:[95,102,114], eigen:[63,134,214], kunststoff:[236,236,228],
  gummi:[37,39,43], griff:[200,38,45], feder:[170,176,184], elektro:[70,76,86], sensor:[40,150,190],
  aktor:[40,44,52], schlauch:[60,64,72], warn:[220,40,40], lampe_gruen:[40,170,80],
  lampe_gelb:[240,190,30], lampe_blau:[40,110,210], haube:[170,210,240],
  glas:[110,62,22], etikett:[235,230,215], kronkorken:[212,175,55],
  tisch:[176,140,104], tischplatte:[176,140,104], mensch:[196,184,172]
};
const T = INFO.tisch;
function dekodiere(s) { const b = Uint8Array.from(atob(s), c => c.charCodeAt(0)); return new Float32Array(b.buffer); }
const statisch = [];
for (const p of DATEN) {
  const f = dekodiere(p.d);
  for (let i = 0; i < f.length; i += 9)
    statisch.push({ v: f.subarray(i, i + 9), w: new Float32Array(f.subarray(i, i + 9)), g: p.g, k: p.k, s: p.s });
}
const netze = FLASCHEN.map(f => ({ glas: dekodiere(f.glas), etikett: dekodiere(f.etikett), kork: dekodiere(f.kork) }));

let fi = 0, fl = FLASCHEN[0];
let az = 30, el = -24, zoom = 1, zeigeM = true, zeigeH = true, laeuft = true, tempo = 1, zeit = 0;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const L = (() => { const l = [-0.4, -0.65, 0.65], n = Math.hypot(...l); return l.map(x => x / n); })();
const dunkel = () => getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#10151d";

// ---------------------------------------------------------------- Ablauf
const N = INFO.n, DELTA = 3 / 150 * 180 / Math.PI;     // 3 mm Feinpositionierung in Grad
const TL = 4.0, TZ = 6.0;                                // Ladezeit, Zykluszeit je Flasche
const SCHRITTE = [
  [0.0, 1.2, "S1", "Sternrad taktet die nächste Flasche in die Vorposition (3 mm vor der Station)."],
  [1.2, 2.0, "S2", "Z-Achse fährt den Kopf ab, bis der Magnetstempel den Kronkorken berührt."],
  [2.0, 2.3, "S3", "Sternrad fährt die letzten 3 mm: Kronkorkenrand gleitet über die Hakenlippe."],
  [2.3, 2.9, "S4", "Linearantrieb zieht den Hebel: Haken hebelt den Kronkorken ab (Stempel = Drehpunkt)."],
  [2.9, 3.3, "S5", "Hebel zurück, der Kronkorken haftet am Magnetstempel."],
  [3.3, 4.1, "S6", "Kopf fährt in die sichere Höhe."],
  [4.1, 4.7, "S7", "Servo-Abstreifer schiebt den Kronkorken in den Trichter."],
  [4.7, 5.3, "S8", "Kronkorken fällt durch den Schlauch in den Behälter (Gabellichtschranke zählt)."],
  [5.3, 6.0, "S9", "Abstreifer in Grundstellung, nächste Flasche."],
];
const glatt = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const lin = (a, b, t) => a + (b - a) * glatt(t);

function zustand(t) {
  const H = fl.H, zpW = fl.zp + 0.5, zpS = INFO.zp_sicher;
  const zyklus = TL + N * TZ;
  t = t % zyklus;
  const z = { phi: 0, zp: zpS, hebel: 0, abstr: 0, tuer: 0, k: -1, tk: 0, schritt: null, korken: [], zaehler: 0 };
  for (let i = 0; i < N; i++) z.korken.push("zu");
  if (t < TL) {                                              // Beladen bei offener Haube
    z.tuer = t < 0.8 ? lin(0, 70, t / 0.8) : t < TL - 0.8 ? 70 : lin(70, 0, (t - TL + 0.8) / 0.8);
    z.schritt = ["S0", t < TL - 0.8 ? "Haube offen: Bediener setzt bis zu 8 Flaschen ein, Behälter geleert."
                                    : "Haube geschlossen, Start: Referenzfahrt beendet, Ablauf beginnt."];
    z.phi = DELTA * 0;
    return z;
  }
  const tt = t - TL, k = Math.min(N - 1, Math.floor(tt / TZ)), tk = tt - k * TZ;
  z.k = k; z.tk = tk;
  for (let i = 0; i < k; i++) z.korken[i] = "weg";
  z.zaehler = k;
  const phiVor = -45 * k + DELTA, phiAlt = k === 0 ? 45 + DELTA : -45 * (k - 1);
  const phiEnd = -45 * k;
  // Sternrad
  if (tk < 1.2) z.phi = lin(phiAlt, phiVor, tk / 1.2);
  else if (tk < 2.0) z.phi = phiVor;
  else z.phi = lin(phiVor, phiEnd, (tk - 2.0) / 0.3);
  // Z-Achse
  if (tk < 1.2) z.zp = zpS;
  else if (tk < 2.0) z.zp = lin(zpS, zpW, (tk - 1.2) / 0.8);
  else if (tk < 3.3) z.zp = zpW;
  else z.zp = lin(zpW, zpS, (tk - 3.3) / 0.8);
  // Hebel
  if (tk >= 2.3 && tk < 2.9) z.hebel = lin(0, 15, (tk - 2.3) / 0.6);
  else if (tk >= 2.9 && tk < 3.3) z.hebel = lin(15, 0, (tk - 2.9) / 0.4);
  // Abstreifer
  if (tk >= 4.1 && tk < 4.7) z.abstr = lin(0, 130, (tk - 4.1) / 0.6);
  else if (tk >= 4.7 && tk < 5.3) z.abstr = lin(130, 0, (tk - 4.7) / 0.6);
  // Kronkorken der aktuellen Flasche
  z.korken[k] = tk < 2.3 ? "zu" : tk < 2.9 ? "hebel" : tk < 4.7 ? "magnet" : tk < 5.3 ? "flug" : "weg";
  if (tk >= 5.3) z.zaehler = k + 1;
  for (const s of SCHRITTE) if (tk >= s[0] && tk < s[1]) z.schritt = [s[2], s[3]];
  return z;
}

// ---------------------------------------------------------------- Geometrie
function drehZ(x, y, grad) { const a = grad * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

let inst = [];       // Dreiecke der Flaschen (je Tasche Glas, Etikett, Kronkorken)
function baueInstanzen() {
  inst = [];
  const n = netze[fi];
  for (let i = 0; i < N; i++) {
    for (const [art, f] of [["glas", n.glas], ["etikett", n.etikett], ["kronkorken", n.kork]])
      for (let j = 0; j < f.length; j += 9) inst.push({ v: f.subarray(j, j + 9), w: new Float32Array(9), g: art, i, kork: art === "kronkorken" });
  }
}

function stellung(z) {
  const dzK = z.zp - INFO.zp_modell, zc = z.zp + T, px = INFO.px;
  const a = z.hebel * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const b = z.abstr * Math.PI / 180, cb = Math.cos(b), sb = Math.sin(b);
  const [ax, ay] = INFO.abstreifer;
  const zsb = INFO.schlauch_z[0] + T, zst = INFO.schlauch_z[1] + T;
  const gt = z.tuer * Math.PI / 180, cg = Math.cos(gt), sg = Math.sin(gt);
  const [hy, hz] = INFO.haube;
  for (const t of statisch) {
    const v = t.v, w = t.w, k = t.k;
    for (let j = 0; j < 9; j += 3) {
      let x = v[j], y = v[j + 1], zz = v[j + 2];
      if (k === "st") { [x, y] = drehZ(x, y, z.phi); }
      else if (k === "z" || k === "h" || k === "r" || k === "s") {
        zz += dzK;
        if (k === "h") { const dx = x - px, dz = zz - zc; x = px + ca * dx + sa * dz; zz = zc - sa * dx + ca * dz; }
        if (k === "r") zz -= (INFO.aktor_x - px) * sa;
        if (k === "s") { const dx = x - ax, dy = y - ay; x = ax + cb * dx - sb * dy; y = ay + sb * dx + cb * dy; }
      } else if (k === "sl") {
        const gew = Math.max(0, Math.min(1, (v[j + 2] - zsb) / (zst - zsb)));
        zz += dzK * gew;
      } else if (k === "d") {
        const dy = y - hy, dz = zz - (hz + T); y = hy + cg * dy + sg * dz; zz = hz + T - sg * dy + cg * dz;
      }
      w[j] = x; w[j + 1] = y; w[j + 2] = zz;
    }
  }
  // Flaschen und Kronkorken
  const topZ = Z0T() + fl.H + 1.5, padZ = zc - 7;
  const [tx, ty] = INFO.trichter, [bx, by, bz] = INFO.behaelter;
  for (const t of inst) {
    const v = t.v, w = t.w, i = t.i;
    const st = t.kork ? z.korken[i] : "zu";
    t.weg = st === "weg";
    if (t.weg) continue;
    const winkel = 90 + i * 45 + z.phi;
    const cx = fl.r * Math.cos(winkel * Math.PI / 180), cy = fl.r * Math.sin(winkel * Math.PI / 180);
    for (let j = 0; j < 9; j += 3) {
      let x = v[j] + cx, y = v[j + 1] + cy, zz = v[j + 2];
      if (st === "hebel") { const dx = x - px, dz = zz - zc; x = px + ca * dx + sa * dz; zz = zc - sa * dx + ca * dz; }
      else if (st === "magnet") {
        zz += padZ - topZ;
        x = v[j]; y = v[j + 1] + INFO.ys;
        const s = Math.max(0, Math.min(1, (z.abstr - 55) / 75));
        x += (tx - 0) * s; y += (ty - INFO.ys) * s;
      } else if (st === "flug") {
        const s = glatt((z.tk - 4.7) / 0.6);
        const sx = tx + (bx - tx) * s, sy = ty + (by - ty) * s;
        const sz = (zc - 30) + ((bz + T) - (zc - 30)) * s;
        x = v[j] + sx; y = v[j + 1] + sy; zz = zz - topZ + sz;
      }
      w[j] = x; w[j + 1] = y; w[j + 2] = zz;
    }
  }
}
function Z0T() { return 94 + T; }

// ---------------------------------------------------------------- Zeichnen
function zeichne(z) {
  const W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
  const dk = dunkel();
  g.fillStyle = dk ? "#10151d" : "#eef1f5"; g.fillRect(0, 0, W, H);
  const a = az * Math.PI / 180, e = el * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), ce = Math.cos(e), se = Math.sin(e);
  const nah = zoom > 1.8;
  const cxw = nah ? 60 : 50, cyw = nah ? 150 : -120, czw = nah ? T + 330 : 820;
  const s = Math.min(W, H) / 2100 * zoom, cx = W / 2 + (W > 900 ? 130 * devicePixelRatio : 0), cy = H / 2;
  const P = (x, y, zz) => {
    x -= cxw; y -= cyw; zz -= czw;
    const x1 = x * ca - y * sa, y1 = x * sa + y * ca;
    return [cx + x1 * s, cy - (zz * ce - y1 * se) * s, y1 * ce + zz * se];
  };
  g.lineWidth = 1; g.strokeStyle = dk ? "rgba(140,170,210,0.12)" : "rgba(40,60,90,0.10)";
  for (let i = -1000; i <= 900; i += 100) { const p = P(-700, i, 0), q = P(1100, i, 0); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
  for (let i = -700; i <= 1100; i += 100) { const p = P(i, -1000, 0), q = P(i, 900, 0); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
  const liste = [];
  const alle = statisch.concat(inst);
  for (const t of alle) {
    if (t.weg) continue;
    if (!zeigeM && t.s === "mensch") continue;
    if (!zeigeH && t.g === "haube") continue;
    const w = t.w;
    const ux = w[3] - w[0], uy = w[4] - w[1], uz = w[5] - w[2], vx = w[6] - w[0], vy = w[7] - w[1], vz = w[8] - w[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    const ny1 = nx * sa + ny * ca;
    if (ny1 * ce + nz * se >= 0) continue;
    if (t.g === "tischplatte" && Math.abs(nz) < 0.9) continue;
    const p0 = P(w[0], w[1], w[2]), p1 = P(w[3], w[4], w[5]), p2 = P(w[6], w[7], w[8]);
    const f = FARBE[t.g] || [255, 0, 255];
    const d = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
    const k = 0.38 + 0.62 * d, sp = (t.g === "glas" || t.g === "kronkorken") ? Math.pow(d, 20) * 120 : 0;
    const col = `rgb(${Math.min(255, f[0] * k + sp) | 0},${Math.min(255, f[1] * k + sp) | 0},${Math.min(255, f[2] * k + sp) | 0})`;
    liste.push([p0[2] + p1[2] + p2[2], p0, p1, p2, col, t.g === "haube"]);
  }
  liste.sort((A, B) => B[0] - A[0]);
  g.lineWidth = 0.6;
  for (const [, p0, p1, p2, col, glas] of liste) {
    g.globalAlpha = glas ? 0.16 : 1;
    g.fillStyle = col; g.strokeStyle = col;
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.closePath(); g.fill();
    if (!glas) g.stroke();
  }
  g.globalAlpha = 1;
}

function anzeige(z) {
  document.getElementById("schritt").innerHTML = z.schritt ? `<b>${z.schritt[0]}</b> ${z.schritt[1]}` : "";
  const an = (b, t) => `<span class="${b ? "an" : ""}">${b ? "●" : "○"} ${t}</span>`;
  const kontakt = z.k >= 0 && z.tk >= 1.95 && z.tk < 3.3;
  document.getElementById("tab").innerHTML = `
    <tr><td>Flasche</td><td>${z.k >= 0 ? (z.k + 1) + " / " + N : "–"}</td></tr>
    <tr><td>Kronkorken im Behälter</td><td>${z.zaehler}</td></tr>
    <tr><td>Drehachse (Kopf)</td><td>${z.zp.toFixed(1)} mm ü. Tisch</td></tr>
    <tr><td>Hebel / Abstreifer</td><td>${z.hebel.toFixed(0)}° / ${z.abstr.toFixed(0)}°</td></tr>
    <tr><td colspan="2">${an(z.tuer < 1, "Haube zu")} &nbsp; ${an(kontakt, "Stempelkontakt")}<br>
      ${an(z.k >= 0 && z.tk >= 2.3 && z.korken[z.k] !== "zu", "Flasche in Station")} &nbsp;
      ${an(z.k >= 0 && z.tk >= 4.7 && z.tk < 5.3, "Kronkorken im Schlauch")}</td></tr>`;
}

// ---------------------------------------------------------------- Bedienung
const sel = document.getElementById("fl");
FLASCHEN.forEach((f, i) => sel.add(new Option(`${f.name}  (${f.H} mm, Ø ${f.D})`, i)));
sel.onchange = () => { fi = +sel.value; fl = FLASCHEN[fi]; baueInstanzen(); };
document.getElementById("tempo").oninput = e => tempo = +e.target.value;
document.getElementById("play").onclick = e => { laeuft = !laeuft; e.target.textContent = laeuft ? "⏸ Pause" : "▶ Weiter"; };
document.getElementById("pm").onclick = e => { zeigeM = !zeigeM; e.target.textContent = zeigeM ? "Mensch aus" : "Mensch an"; };
document.getElementById("ph").onclick = e => { zeigeH = !zeigeH; e.target.textContent = zeigeH ? "Haube aus" : "Haube an"; };
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { [az, el, zoom] = b.dataset.v.split(",").map(Number); });
let zieh = null, pins = new Map(), pinchD = 0;
cv.addEventListener("pointerdown", e => { pins.set(e.pointerId, [e.clientX, e.clientY]); zieh = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup", e => { pins.delete(e.pointerId); zieh = null; pinchD = 0; });
cv.addEventListener("pointermove", e => {
  if (pins.has(e.pointerId)) pins.set(e.pointerId, [e.clientX, e.clientY]);
  if (pins.size === 2) { const [p, q] = [...pins.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (pinchD) zoom *= d / pinchD; pinchD = d; return; }
  if (!zieh) return;
  az += (e.clientX - zieh[0]) * 0.4; el = Math.max(-89, Math.min(60, el + (e.clientY - zieh[1]) * 0.4));
  zieh = [e.clientX, e.clientY];
});
cv.addEventListener("wheel", e => { e.preventDefault(); zoom *= e.deltaY < 0 ? 1.1 : 0.9; }, { passive: false });

baueInstanzen();
let letzte = performance.now();
function schleife(jetzt) {
  const dt = Math.min(0.1, (jetzt - letzte) / 1000); letzte = jetzt;
  if (laeuft) zeit += dt * tempo;
  const z = zustand(zeit);
  stellung(z); zeichne(z); anzeige(z);
  requestAnimationFrame(schleife);
}
requestAnimationFrame(schleife);
</script>
</body>
</html>
